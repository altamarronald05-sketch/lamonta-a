    <text x="200" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="12" fill="#FFFFFF">JAMÓN AHUMADO TAJADO</text>
    <text x="200" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#FFE4E6">27 LONCHAS SEPARADAS · 500 GR</text>

