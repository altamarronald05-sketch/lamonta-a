<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="60%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
    <linearGradient id="blockSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="blockShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="275" rx="150" ry="24" fill="#000000" opacity="0.1" />

  <!-- Bloque 3D de queso en perspectiva -->
  <g filter="url(#blockShadow)">
    <!-- Cara Superior -->
    <polygon points="120,90 280,70 320,130 160,150" fill="url(#blockGrad)" stroke="#FBBF24" stroke-width="1.5" />
    
    <!-- Cara Frontal -->
    <polygon points="160,150 320,130 320,230 160,250" fill="url(#blockSide)" stroke="#F59E0B" stroke-width="1.5" />
    
    <!-- Cara Lateral Izquierda -->
    <polygon points="120,90 160,150 160,250 120,190" fill="#FBBF24" stroke="#F59E0B" stroke-width="1.5" opacity="0.9" />

    <!-- Faja de envoltura institucional roja con logo -->
    <polygon points="175,148 245,139 245,239 175,248" fill="#C1121F" opacity="0.95" />
    <polygon points="135,112 190,105 205,144 150,151" fill="#780000" opacity="0.85" />
    
    <text x="210" y="195" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#FFB703">LA MONTAÑA</text>
    <text x="210" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="8" fill="#FFFFFF">BARRA 2.5 KG</text>

    <!-- Sello HORECA -->
    <circle cx="280" cy="180" r="18" fill="#0284C7" />
    <text x="280" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="7" fill="#FFFFFF">HORECA</text>
  </g>
</svg>
