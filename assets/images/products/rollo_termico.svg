<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="rollShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="275" rx="120" ry="18" fill="#000000" opacity="0.1" />

  <g filter="url(#rollShadow)">
    <!-- Cilindro de Rollo Térmico Isométrico / 3D -->
    <!-- Rollo acostado o vertical -->
    <!-- Caras cilíndricas -->
    <!-- Cuerpo del cilindro -->
    <path d="M120,110 L120,220 C120,245 160,260 200,260 C240,260 280,245 280,220 L280,110 Z" fill="url(#paperGrad)" stroke="#94A3B8" stroke-width="2"/>

    <!-- Tapa superior elipse del rollo -->
    <ellipse cx="200" cy="110" rx="80" ry="32" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
    
    <!-- Centro de plástico negro (bushing / core) -->
    <ellipse cx="200" cy="110" rx="20" ry="8" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <ellipse cx="200" cy="110" rx="14" ry="5.5" fill="#000000"/>

    <!-- Anillos concéntricos de papel bobinado -->
    <ellipse cx="200" cy="110" rx="60" ry="24" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>
    <ellipse cx="200" cy="110" rx="40" ry="16" fill="none" stroke="#E2E8F0" stroke-width="1.2"/>

    <!-- Faja de embalaje institucional -->
    <path d="M120,155 C120,180 160,195 200,195 C240,195 280,180 280,155 L280,205 C280,230 240,245 200,245 C160,245 120,230 120,205 Z" fill="#0284C7"/>
    
    <text x="200" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="11" fill="#FFFFFF">ROLLO TÉRMICO POS</text>
    <text x="200" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#BAE6FD">80 mm x 60 m • ALTA SENSIBILIDAD</text>
    <text x="200" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#FFFFFF">PARA FACTURACIÓN DIAN</text>
  </g>
</svg>
