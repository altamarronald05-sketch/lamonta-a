<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%">
  <defs>
    <radialGradient id="cheeseGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="80%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1E293B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Fondo sutil de plato / sombra de apoyo -->
  <ellipse cx="200" cy="270" rx="140" ry="22" fill="#000000" opacity="0.1" />

  <!-- Paquete sellado al vacío -->
  <g filter="url(#cardShadow)">
    <rect x="70" y="45" width="260" height="215" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Banda superior de marca -->
    <path d="M70,61 Q70,45 86,45 L314,45 Q330,45 330,61 L330,95 L70,95 Z" fill="#C1121F" />
    <circle cx="200" cy="70" r="14" fill="#FFB703" />
    <text x="200" y="74" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="10" fill="#780000">LA MONTAÑA</text>
    <text x="200" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="8" fill="#FFFBEB" letter-spacing="1.5">QUESO MOZZARELLA TAJADO</text>

    <!-- Ventana transparente con lonchas de queso -->
    <rect x="88" y="105" width="224" height="135" rx="10" fill="url(#cheeseGlow)" stroke="#FCD34D" stroke-width="1.5" />
    
    <!-- Lonchas apiladas y escalonadas -->
    <g fill="#FEF08A" stroke="#FBBF24" stroke-width="1.2">
      <!-- Loncha 1 -->
      <path d="M110,130 L270,120 L290,185 L130,195 Z" opacity="0.6"/>
      <!-- Loncha 2 -->
      <path d="M106,140 L266,130 L286,195 L126,205 Z" opacity="0.8"/>
      <!-- Loncha 3 frontal -->
      <path d="M102,150 L262,140 L282,205 L122,215 Z" fill="#FFFBEB"/>
    </g>

    <!-- Sello de calidad y textura hilada -->
    <circle cx="130" cy="180" r="22" fill="#C1121F" opacity="0.95" />
    <text x="130" y="176" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="9" fill="#FFB703">HILADO</text>
    <text x="130" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="7" fill="#FFFFFF">PERFECTO</text>

    <!-- Tag de gramaje -->
    <rect x="235" y="215" width="65" height="18" rx="6" fill="#1E293B" />
    <text x="267" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="9" fill="#F8FAFC">1.250 gr</text>
  </g>
</svg>
